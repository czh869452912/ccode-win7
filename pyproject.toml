[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "embedagent"
version = "0.1.0"
description = "Offline-first agentic coding platform with a generic Agent Core and replaceable workflow packages"
readme = "README.md"
requires-python = ">=3.8,<3.9"
dependencies = [
    "prompt-toolkit==3.0.52",
    "rich==14.3.3",
    # GUI dependencies
    "pywebview>=4.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "websockets>=11.0",
]

[project.optional-dependencies]
# 纯 CLI/TUI 版本（无 GUI）
cli = [
    "prompt-toolkit==3.0.52",
    "rich==14.3.3",
]

[project.scripts]
embedagent = "embedagent.cli:main"
embedagent-gui = "embedagent.frontend.gui.launcher:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["embedagent*", "embedagent_core*", "embedagent_host*"]

[tool.setuptools.package-data]
embedagent = [
    "frontend/gui/static/**/*",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py38"
line-length = 100
exclude = ["tests/manual"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.black]
target-version = ["py38"]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "unit: pure unit tests, no I/O",
    "harness: task_graph / phase_engine / mode_runner components",
    "session: session runtime, restore, timeline",
    "gui: GUI and frontend tests (requires display)",
    "slow: integration tests > 5 seconds",
]
filterwarnings = [
    "error::DeprecationWarning:embedagent.*",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/embedagent", "src/embedagent_core", "src/embedagent_host"]
omit = ["*/tests/*", "*/fixtures/*", "*/manual/*"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
]
show_missing = true

[dependency-groups]
dev = [
    "black==24.8.0",
    "pytest>=8.3.5",
    "pytest-cov>=4.0,<6.0",
    "ruff>=0.15.12",
]
