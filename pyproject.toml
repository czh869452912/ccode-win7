[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "embedagent"
version = "0.1.0"
description = "Offline-first agentic coding platform with a generic Agent Core and replaceable workflow packages"
readme = "README.md"
requires-python = ">=3.8,<3.9"
dependencies = [
    "embedagent-core==0.1.0",
    "embedagent-protocol==0.1.0",
    "embedagent-host==0.1.0",
    "embedagent-composition==0.1.0",
    "embedagent-workflow-cpp==0.1.0",
]

[project.optional-dependencies]
tui = [
    "prompt-toolkit==3.0.52",
    "rich==14.3.3",
]
gui = [
    "pywebview>=4.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "websockets>=11.0",
]

[project.scripts]
embedagent = "embedagent.cli:main"
embedagent-gui = "embedagent.frontend.gui.launcher:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["embedagent", "embedagent.*"]
namespaces = false

[tool.setuptools.package-data]
embedagent = [
    "frontend/gui/static/**/*",
]

[tool.uv]
package = true

[tool.uv.workspace]
members = [
    "packages/embedagent-core",
    "packages/embedagent-protocol",
    "packages/embedagent-host",
    "packages/embedagent-composition",
    "packages/embedagent-workflow-cpp",
]

[tool.uv.sources]
embedagent-core = { workspace = true }
embedagent-protocol = { workspace = true }
embedagent-host = { workspace = true }
embedagent-composition = { workspace = true }
embedagent-workflow-cpp = { workspace = true }

[tool.ruff]
target-version = "py38"
line-length = 100
exclude = ["tests/manual"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.black]
target-version = ["py38"]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "unit: pure unit tests, no I/O",
    "harness: task_graph / phase_engine / mode_runner components",
    "session: session runtime, restore, timeline",
    "gui: GUI and frontend tests (requires display)",
    "slow: integration tests > 5 seconds",
    "release: packaging, distribution, offline, and release-gate tests",
    "performance: explicit performance threshold tests",
]
filterwarnings = [
    "error::DeprecationWarning:embedagent.*",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = [
    "src/embedagent",
    "packages/embedagent-core/src/embedagent_core",
    "packages/embedagent-protocol/src/embedagent_protocol",
    "packages/embedagent-host/src/embedagent_host",
    "packages/embedagent-composition/src/embedagent_composition",
    "packages/embedagent-workflow-cpp/src/embedagent_workflow_cpp",
]
omit = ["*/tests/*", "*/fixtures/*", "*/manual/*"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
]
show_missing = true

[dependency-groups]
dev = [
    "black==24.8.0",
    "fastapi>=0.100",
    "prompt-toolkit==3.0.52",
    "pywebview>=4.0",
    "pytest>=8.3.5",
    "pytest-cov>=4.0,<6.0",
    "rich==14.3.3",
    "ruff>=0.15.12",
    "tomli==2.4.1",
    "uvicorn[standard]>=0.23",
    "websockets>=11.0",
]
