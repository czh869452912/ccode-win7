name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        # Use the Python already provided by setup-python, not uv's own download
        run: uv sync --locked --python "$(which python)"
      - name: Run lint
        run: uv run --locked --python "$(which python)" python scripts/lint.py

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        # Use the Python already provided by setup-python, not uv's own download
        run: uv sync --locked --python "$(which python)"
      - name: Audit test partitions
        run: uv run --locked --python "$(which python)" python scripts/test-suite.py audit
      - name: Run complete regular tests
        run: uv run --locked --python "$(which python)" python scripts/test-suite.py full --coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  performance:
    name: Performance thresholds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --locked --python "$(which python)"
      - name: Run performance tests
        run: uv run --locked --python "$(which python)" python scripts/test-suite.py performance

  frontend:
    name: Frontend test and build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src/embedagent/frontend/gui/webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/embedagent/frontend/gui/webapp/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Build frontend assets
        run: npm run build
      - name: Verify generated assets are committed
        working-directory: .
        run: git diff --exit-code -- src/embedagent/frontend/gui/static

  smoke:
    name: Smoke test (workspace install + CLI import)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Install uv
        run: pip install uv
      - name: Install locked workspace
        # The product depends on the five lower workspace distributions. Resolve
        # them from this checkout instead of asking pip for unpublished wheels.
        run: uv sync --locked --python "$(which python)"
      - name: Import check
        run: uv run --locked --python "$(which python)" python -c "import embedagent; print('import OK')"
      - name: CLI entry point check
        # embedagent.cli:main — just verify the entry point is importable and responds
        run: uv run --locked --python "$(which python)" python -c "from embedagent.cli import main; print('cli entry point OK')"

  windows-packaging:
    name: Windows packaging and release tests
    runs-on: windows-latest
    env:
      UV_CACHE_DIR: ${{ github.workspace }}\.uv-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked workspace
        run: uv sync --locked --python python
      - name: Run Windows release tests
        run: uv run --locked --python python python scripts/test-suite.py release
