name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        # Use the Python already provided by setup-python, not uv's own download
        run: uv sync --locked --python "$(which python)"
      - name: Run lint
        run: uv run --locked --python "$(which python)" python scripts/lint.py

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        # Use the Python already provided by setup-python, not uv's own download
        run: uv sync --python "$(which python)"
      - name: Run tests
        run: uv run --locked --python "$(which python)" pytest tests/ -m "not slow and not gui" --cov=src/embedagent --cov-report=xml --cov-report=term-missing
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  smoke:
    name: Smoke test (workspace install + CLI import)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Install locked workspace
        # The product depends on the five lower workspace distributions. Resolve
        # them from this checkout instead of asking pip for unpublished wheels.
        run: uv sync --locked --python "$(which python)"
      - name: Import check
        run: uv run --locked --python "$(which python)" python -c "import embedagent; print('import OK')"
      - name: CLI entry point check
        # embedagent.cli:main — just verify the entry point is importable and responds
        run: uv run --locked --python "$(which python)" python -c "from embedagent.cli import main; print('cli entry point OK')"

  windows-packaging:
    name: Windows packaging and release tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked workspace
        run: uv sync --locked --python python
      - name: Run Windows packaging tests
        run: >-
          uv run --locked --python python pytest
          tests/test_packaging_control_plane.py
          tests/test_phase7_doctor.py
          tests/test_release_reproducibility.py
          tests/test_python_distribution_smoke.py
          -v
