name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Install lint tools
        run: pip install ruff black
      - name: ruff check
        run: ruff check src/ tests/
      - name: black check
        run: black --check src/ tests/

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        # Use the Python already provided by setup-python, not uv's own download
        run: uv sync --python "$(which python)"
      - name: Run tests
        run: uv run --python "$(which python)" pytest tests/ -m "not slow and not gui" --cov=src/embedagent --cov-report=xml --cov-report=term-missing
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  smoke:
    name: Smoke test (package install + CLI import)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Install package (CLI extras only, no GUI deps)
        run: pip install -e ".[cli]"
      - name: Import check
        run: python -c "import embedagent; print('import OK')"
      - name: CLI entry point check
        # embedagent.cli:main — just verify the entry point is importable and responds
        run: python -c "from embedagent.cli import main; print('cli entry point OK')"
