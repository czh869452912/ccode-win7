[project]
name = "embedagent-protocol"
version = "0.1.0"
requires-python = ">=3.8,<3.9"
dependencies = []

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["embedagent_protocol*"]
